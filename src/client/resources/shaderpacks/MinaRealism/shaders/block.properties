# Ids read by the shaders through mc_Entity (see lib/common.glsl).

# Water: reflects the sky and tints sunlight passing through it.
block.10=water

# Leaves and plants (20-23): light passes through them. The ids also say how
# the wind moves them (lib/wind.glsl).

# Leaves: every vertex flutters a little.
block.20=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves cherry_leaves pale_oak_leaves azalea_leaves flowering_azalea_leaves yellow_poplar_leaves orange_poplar_leaves red_poplar_leaves

# Plants rooted in the block below: the tops sway, the bases stay put.
block.21=short_grass fern dead_bush bush firefly_bush short_dry_grass tall_dry_grass seagrass nether_sprouts crimson_roots warped_roots wildflowers \
 dandelion golden_dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley wither_rose \
 open_eyeblossom closed_eyeblossom cactus_flower torchflower \
 sweet_berry_bush wheat carrots potatoes beetroots \
 tall_grass:half=lower large_fern:half=lower tall_seagrass:half=lower \
 sunflower:half=lower lilac:half=lower rose_bush:half=lower peony:half=lower pitcher_plant:half=lower

# Upper halves of tall plants: they carry on the sway of the lower half.
block.22=tall_grass:half=upper large_fern:half=upper tall_seagrass:half=upper \
 sunflower:half=upper lilac:half=upper rose_bush:half=upper peony:half=upper pitcher_plant:half=upper

# Stiff or clinging plants: only a slight tremor.
block.23=vine kelp kelp_plant sugar_cane mangrove_propagule spore_blossom pink_petals

# Plant sprites must use cutout rendering; blending their crossed planes exposes rectangular cards.
layer.cutout=short_grass fern dead_bush bush firefly_bush short_dry_grass tall_dry_grass wildflowers \
 dandelion golden_dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley wither_rose \
 open_eyeblossom closed_eyeblossom cactus_flower torchflower torchflower_crop \
 tall_grass large_fern sunflower lilac rose_bush peony pitcher_plant \
 sweet_berry_bush pink_petals spore_blossom mangrove_propagule

# Light sources whose bright texels glow.
block.30=lava glowstone sea_lantern shroomlight magma_block jack_o_lantern lantern soul_lantern \
 torch wall_torch soul_torch soul_wall_torch fire soul_fire campfire soul_campfire end_rod \
 ochre_froglight verdant_froglight pearlescent_froglight redstone_lamp:lit=true

# Glass and ice: reflect like smooth dielectrics.
block.40=glass glass_pane ice white_stained_glass orange_stained_glass magenta_stained_glass \
 light_blue_stained_glass yellow_stained_glass lime_stained_glass pink_stained_glass gray_stained_glass light_gray_stained_glass \
 cyan_stained_glass purple_stained_glass blue_stained_glass brown_stained_glass green_stained_glass red_stained_glass \
 black_stained_glass white_stained_glass_pane orange_stained_glass_pane magenta_stained_glass_pane light_blue_stained_glass_pane yellow_stained_glass_pane \
 lime_stained_glass_pane pink_stained_glass_pane gray_stained_glass_pane light_gray_stained_glass_pane cyan_stained_glass_pane purple_stained_glass_pane \
 blue_stained_glass_pane brown_stained_glass_pane green_stained_glass_pane red_stained_glass_pane black_stained_glass_pane

# Natural ground drawn with photographic materials (lib/realtex.glsl).
block.50=grass_block:snowy=false moss_block
block.51=dirt rooted_dirt podzol mycelium dirt_path
block.52=stone andesite granite diorite tuff calcite dripstone_block
block.53=sand suspicious_sand
block.54=gravel suspicious_gravel
block.55=snow_block snow powder_snow
block.56=deepslate
block.57=mud coarse_dirt
block.58=grass_block:snowy=true
block.59=leaf_litter
