# Mina Realism: physically based sky and clouds, sun shadows, screen-space ray tracing,
# mist and eye adaptation.

# Lighting, the sun, moon, stars and clouds all come from the pack; vanilla ones are off.
oldLighting=false
separateAo=true
sun=false
moon=false
clouds=off
underwaterOverlay=false
vignette=false
dynamicHandLight=true

shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true

texture.noise=tex/noise.png
# 3D noise the clouds are carved from (tools/generate_cloud_noise.py).
customTexture.cloudnoise=tex/cloud_noise.png

# Whether rain reaches the camera: full sky light (15) at the eye means open
# sky, while a roof or leaves overhead leave at most 14. Drops land within a
# couple of seconds and take longer to dry off.
uniform.float.lensRainExposure=smooth(if(eyeBrightness.y > 232, 1.0, 0.0), 2.0, 10.0)

# shadowcolor1 stores the depth of water surfaces and of shadow casters; it must not be blended.
blend.shadow=off

# Rain coverage in colortex8 must add up across overlapping streaks.
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Water overwrites the surface data behind it for reflections.
blend.gbuffers_water.colortex2=off
blend.gbuffers_water.colortex3=off

profile.LOW=QUALITY:0 shadowMapResolution:1024 shadowDistance:96.0 !PSEUDO_RT
profile.MEDIUM=QUALITY:1 shadowMapResolution:2048 shadowDistance:128.0 PSEUDO_RT
profile.HIGH=QUALITY:2 shadowMapResolution:4096 shadowDistance:192.0 PSEUDO_RT

screen=<profile> QUALITY PSEUDO_RT <empty> [LIGHTING] [SKY] [FOG] [NATURE] [CAMERA]
screen.LIGHTING=shadowMapResolution shadowDistance SHADOW_SOFTNESS SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS EMISSIVE_BRIGHTNESS NIGHT_BRIGHTNESS
screen.SKY=sunPathRotation SUN_MOON_SIZE SKY_BRIGHTNESS STAR_BRIGHTNESS MOON_PHASE_BRIGHTNESS VOLUMETRIC_CLOUDS CLOUD_COVERAGE CIRRUS_CLOUDS CIRRUS_AMOUNT
screen.FOG=VOLUMETRIC_LIGHT VL_STRENGTH FOG_DENSITY RAIN_AMOUNT LENS_DROPS
screen.NATURE=WAVING_PLANTS WIND_STRENGTH TEXTURE_BUMPS BUMP_STRENGTH WATER_REFRACTION
screen.CAMERA=AUTO_EXPOSURE EXPOSURE_BIAS BLOOM BLOOM_STRENGTH TAA LENS_VIGNETTE CHROMATIC_ABERRATION SENSOR_NOISE

sliders=QUALITY shadowMapResolution shadowDistance SHADOW_SOFTNESS SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS EMISSIVE_BRIGHTNESS NIGHT_BRIGHTNESS sunPathRotation SUN_MOON_SIZE SKY_BRIGHTNESS STAR_BRIGHTNESS CLOUD_COVERAGE CIRRUS_AMOUNT VL_STRENGTH FOG_DENSITY RAIN_AMOUNT EXPOSURE_BIAS BLOOM_STRENGTH WIND_STRENGTH BUMP_STRENGTH
